name: Update acq Homebrew Formula

on:
  schedule:
    # Every 15 minutes, offset from common top-of-hour GitHub Actions load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "agentic-coding-quickstart release tag to package, e.g. v3.1.0. Leave blank for latest release."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-acq-formula
  cancel-in-progress: false

jobs:
  update-formula:
    name: Update Formula/acq.rb
    # Keep this scheduled updater on a tested runner image until Ubuntu 26 is validated.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out homebrew tap
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: true

      - name: Resolve acq release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
            gh api "repos/GSA-TTS/agentic-coding-quickstart/releases/tags/${tag}" >/dev/null
          else
            tag="$(gh api repos/GSA-TTS/agentic-coding-quickstart/releases/latest --jq '.tag_name')"
          fi

          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "Could not resolve an acq release tag." >&2
            exit 1
          fi

          version="${tag#v}"
          tarball_url="https://github.com/GSA-TTS/agentic-coding-quickstart/archive/refs/tags/${tag}.tar.gz"
          wheelhouse_arm64_url="https://github.com/GSA-TTS/agentic-coding-quickstart/releases/download/${tag}/provider-input-validator-wheelhouse-macos-arm64.tar.gz"
          wheelhouse_x86_64_url="https://github.com/GSA-TTS/agentic-coding-quickstart/releases/download/${tag}/provider-input-validator-wheelhouse-macos-x86_64.tar.gz"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "tarball_url=${tarball_url}"
            echo "wheelhouse_arm64_url=${wheelhouse_arm64_url}"
            echo "wheelhouse_x86_64_url=${wheelhouse_x86_64_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify required wheelhouse release assets
        id: wheelhouse_check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          WHEELHOUSE_ARM64_URL: ${{ steps.release.outputs.wheelhouse_arm64_url }}
          WHEELHOUSE_X86_64_URL: ${{ steps.release.outputs.wheelhouse_x86_64_url }}
        run: |
          set -euo pipefail

          missing=""

          # Use HEAD requests to probe asset availability before any download attempt.
          # HTTP 302 redirects are followed; 404/non-2xx means the asset is absent.
          arm64_status="$(curl --head --location --silent --output /dev/null \
            --write-out '%{http_code}' "${WHEELHOUSE_ARM64_URL}")"
          x86_64_status="$(curl --head --location --silent --output /dev/null \
            --write-out '%{http_code}' "${WHEELHOUSE_X86_64_URL}")"

          if [ "${arm64_status}" != "200" ]; then
            missing="${missing} provider-input-validator-wheelhouse-macos-arm64.tar.gz (HTTP ${arm64_status})"
          fi
          if [ "${x86_64_status}" != "200" ]; then
            missing="${missing} provider-input-validator-wheelhouse-macos-x86_64.tar.gz (HTTP ${x86_64_status})"
          fi

          if [ -n "${missing}" ]; then
            echo "Wheelhouse assets not yet available for ${TAG}; skipping this run so the scheduler can retry." >&2
            echo "Missing:${missing}" >&2
            echo "assets_ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Both wheelhouse assets confirmed available for ${TAG}."
            echo "assets_ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Calculate source tarball sha256
        id: tarball
        if: steps.wheelhouse_check.outputs.assets_ready == 'true'
        env:
          TARBALL_URL: ${{ steps.release.outputs.tarball_url }}
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error "${TARBALL_URL}" --output acq.tar.gz
          sha256="$(sha256sum acq.tar.gz | cut -d ' ' -f 1)"

          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Calculate validator wheelhouse checksums
        id: wheelhouses
        if: steps.wheelhouse_check.outputs.assets_ready == 'true'
        env:
          WHEELHOUSE_ARM64_URL: ${{ steps.release.outputs.wheelhouse_arm64_url }}
          WHEELHOUSE_X86_64_URL: ${{ steps.release.outputs.wheelhouse_x86_64_url }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "${WHEELHOUSE_ARM64_URL}" --output validator-wheelhouse-arm64.tar.gz
          curl --fail --location --silent --show-error "${WHEELHOUSE_X86_64_URL}" --output validator-wheelhouse-x86_64.tar.gz
          echo "arm64_sha256=$(sha256sum validator-wheelhouse-arm64.tar.gz | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
          echo "x86_64_sha256=$(sha256sum validator-wheelhouse-x86_64.tar.gz | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Update formula
        if: steps.wheelhouse_check.outputs.assets_ready == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TARBALL_URL: ${{ steps.release.outputs.tarball_url }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
          WHEELHOUSE_ARM64_URL: ${{ steps.release.outputs.wheelhouse_arm64_url }}
          WHEELHOUSE_X86_64_URL: ${{ steps.release.outputs.wheelhouse_x86_64_url }}
          WHEELHOUSE_ARM64_SHA256: ${{ steps.wheelhouses.outputs.arm64_sha256 }}
          WHEELHOUSE_X86_64_SHA256: ${{ steps.wheelhouses.outputs.x86_64_sha256 }}
        run: |
          set -euo pipefail
          test -f Formula/acq.rb
          ruby scripts/update-formula.rb

      - name: Verify generated formula structure
        if: steps.wheelhouse_check.outputs.assets_ready == 'true'
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import sys, re

          path = "Formula/acq.rb"
          with open(path) as f:
              formula = f.read()

          errors = []

          # 1. depends_on :macos must be present — macOS-only wheelhouses/python.
          if "depends_on :macos" not in formula:
              errors.append("FAIL: 'depends_on :macos' not found in generated formula")

          # 2. Both wheelhouse resource blocks must be present (no partial state).
          has_arm = 'resource "provider-input-validator-wheelhouse-arm64"' in formula
          has_x86 = 'resource "provider-input-validator-wheelhouse-x86-64"' in formula
          if has_arm != has_x86:
              errors.append(f"FAIL: partial wheelhouse resource state (arm64={has_arm}, x86-64={has_x86})")

          # 3. No trailing whitespace on any line — covers blank separator between resource blocks.
          for i, line in enumerate(formula.splitlines(True), 1):
              if re.match(r'^[ \t]+\n$', line):
                  errors.append(f"FAIL: trailing whitespace on line {i}: {line!r}")

          # 4. Exact shape assertion on resource block indentation.
          #    Every 'resource "provider-input-validator-wheelhouse-' line must start with exactly 2 spaces.
          for i, line in enumerate(formula.splitlines(True), 1):
              if re.match(r'\s+resource "provider-input-validator-wheelhouse-', line):
                  if not line.startswith("  resource "):
                      errors.append(f"FAIL: resource header on line {i} not indented with exactly 2 spaces: {line!r}")

          # 5. python@3.13 dependency is present.
          if 'depends_on "python@3.13"' not in formula:
              errors.append("FAIL: 'depends_on \"python@3.13\"' not found in generated formula")

          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)

          print(f"OK: generated formula structure checks passed ({path})")
          PYTHON

      - name: Open pull request
        if: steps.wheelhouse_check.outputs.assets_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          TARBALL_URL: ${{ steps.release.outputs.tarball_url }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Formula/acq.rb; then
            echo "Formula/acq.rb is already current for ${TAG}."
            exit 0
          fi

          branch="update-acq-${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch the reusable PR branch so force-with-lease has an expected SHA.
          remote_branch="$(git ls-remote --heads origin "refs/heads/${branch}")"
          if [ -n "${remote_branch}" ]; then
            lease_sha="${remote_branch%%$'\t'*}"
          else
            lease_sha=""
          fi

          git checkout -B "${branch}"
          git add Formula/acq.rb
          git commit -m "update acq formula to ${VERSION}"

          if [ -n "${lease_sha}" ]; then
            git push --force-with-lease="refs/heads/${branch}:${lease_sha}" origin "${branch}"
          else
            git push --force-with-lease="refs/heads/${branch}:" origin "${branch}"
          fi

          pr_body="$(mktemp)"
          cat > "${pr_body}" <<EOF
          Updates the acq Homebrew formula for GSA-TTS/agentic-coding-quickstart ${TAG}.

          Source tarball:
          ${TARBALL_URL}

          SHA-256:
          \`${SHA256}\`

          Verification:
          - Resolved release tag from GSA-TTS/agentic-coding-quickstart
          - Confirmed both wheelhouse assets available (HTTP 200) before download
          - Downloaded the GitHub release source tarball and both wheelhouse archives
          - Recomputed sha256 for all three locally in this workflow
          - Updated \`Formula/acq.rb\`
          EOF

          if gh pr view "${branch}" --json number >/dev/null 2>&1; then
            gh pr edit "${branch}" \
              --title "Update acq formula to ${VERSION}" \
              --body-file "${pr_body}"
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "Update acq formula to ${VERSION}" \
              --body-file "${pr_body}"
          fi
