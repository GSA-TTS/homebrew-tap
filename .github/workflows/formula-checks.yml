name: macOS Formula Checks

# Triggered on pull requests that touch the formula or the updater workflow.
# Validates brew style, brew audit --strict, and the updater transformation
# (fixtures, idempotency, partial-state fail-closed, no trailing whitespace).
#
# Real `brew install` / `brew test` are NOT run here because fixture asset
# URLs are synthetic.  Those gates belong on the separately-generated
# post-release formula PR where wheelhouse assets exist.  See issue #12.

on:
  pull_request:
    paths:
      - "Formula/acq.rb"
      - ".github/workflows/update-acq-formula.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: formula-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula-checks:
    name: macOS formula checks
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # -----------------------------------------------------------------------
      # 1. Updater transformation tests (Ruby / Minitest, no network)
      # -----------------------------------------------------------------------
      - name: Run updater transformation tests
        run: ruby test/test_update_formula.rb

      # -----------------------------------------------------------------------
      # 2. brew style + brew audit --strict on a disposable local tap
      #
      # We create a temporary tap, copy the committed fixture formula (post-
      # transform) into it, run the checks by fully qualified formula name, and
      # tear everything down regardless of pass/fail.
      #
      # brew install / brew test are intentionally omitted: the fixture URLs are
      # synthetic.  See the workflow header for the rationale.
      # -----------------------------------------------------------------------
      - name: Create and trust disposable local tap
        run: |
          set -euo pipefail

          # Use a name that will not collide with any real tap.
          TAP_NAME="acq-ci-fixture/tap"
          TAP_DIR="$(brew --repository)/Library/Taps/acq-ci-fixture/homebrew-tap"

          # Validate tap name and directory path before proceeding (SI-10: Input Validation).
          if [[ ! "${TAP_NAME}" =~ ^[a-zA-Z0-9_/-]+$ ]]; then
            echo "FATAL: TAP_NAME contains invalid characters: ${TAP_NAME}" >&2
            exit 1
          fi
          if [[ ! "${TAP_DIR}" =~ ^/.*/homebrew-tap$ ]]; then
            echo "FATAL: TAP_DIR does not match expected pattern: ${TAP_DIR}" >&2
            exit 1
          fi

          mkdir -p "${TAP_DIR}/Formula"

          # Homebrew requires the tap directory to be a git repository.
          git -C "${TAP_DIR}" init -q
          git -C "${TAP_DIR}" config user.email "ci@example.com"
          git -C "${TAP_DIR}" config user.name "CI"

          # Install the committed post-transform fixture formula, mode 0644.
          install -m 0644 test/fixtures/acq.post.rb "${TAP_DIR}/Formula/acq.rb"

          # Commit so Homebrew recognises the tap as a valid git repo.
          git -C "${TAP_DIR}" add Formula/acq.rb
          git -C "${TAP_DIR}" commit -q -m "fixture formula"

          # Record the tap directory for subsequent steps.
          echo "TAP_DIR=${TAP_DIR}" >> "${GITHUB_ENV}"
          echo "TAP_NAME=${TAP_NAME}" >> "${GITHUB_ENV}"
          echo "FORMULA_FQN=${TAP_NAME}/acq" >> "${GITHUB_ENV}"

          # Register the local tap so brew style/audit can find it by qualified name.
          brew tap "${TAP_NAME}" "${TAP_DIR}"

      - name: brew style (fixture formula)
        run: |
          set -euo pipefail
          brew style "${FORMULA_FQN}"

      - name: brew audit --strict (fixture formula)
        run: |
          set -euo pipefail
          brew audit --strict "${FORMULA_FQN}"

      - name: Remove disposable tap
        if: always()
        run: |
          set -euo pipefail

          # Validate paths before cleanup (SI-10: Input Validation, AC-6: Least Privilege).
          if [[ -n "${TAP_NAME:-}" ]]; then
            brew untap "${TAP_NAME}" || echo "WARN: brew untap failed (tap may not exist)" >&2
          fi

          if [[ -n "${TAP_DIR:-}" ]] && [[ "${TAP_DIR}" =~ ^/.*/homebrew-tap$ ]]; then
            rm -rf "${TAP_DIR}"
          fi
